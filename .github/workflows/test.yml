name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node-test:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check dist/lan-topo-card.js
      - name: Unit tests
        run: node --test
