name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # HACS hiện phiên bản theo tag; VERSION trong file JS lệch tag thì dừng.
      - name: Validate version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          JS=$(sed -n 's/^export const VERSION = "\(.*\)";/\1/p' dist/lan-topo-card.js)
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$JS" ] || [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG != VERSION $JS / package.json $PKG"; exit 1
          fi

      - name: Test
        run: node --test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/lan-topo-card.js
          generate_release_notes: true
